<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Captura — simulador CC2</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/pantallas.css">
</head>
<body>
  <!--
    Deja la aplicación en un estado concreto para fotografiarla. El estado se
    elige con el parámetro ?vista= de la URL:
      menu       → catálogo (por defecto)
      binaria    → búsqueda binaria a media traza
      secuencial → búsqueda secuencial a media traza
      hash       → función módulo, insertando una clave que colisiona
      hash-libre → función módulo, insertando en una casilla libre
      eliminar-secuencial → eliminando una clave del medio, con desplazamiento
      eliminar-binaria    → lo mismo, localizando la clave por división
      eliminar-hash       → eliminando del medio de un sondeo: el grupo de
                            atrás vuelve a pasar por la función hash

    Con ?paso=fin se recorre la traza completa en lugar de detenerse en el
    primer paso, que es lo que hay que mirar en la vista apilada y en el
    cálculo de la dirección. El tratamiento de colisiones se elige con
    ?tratamiento=ninguno|reasignacion (por defecto, reasignación).

    Uso:
      msedge --headless --disable-gpu --window-size=1600,1000 \
             --screenshot=salida.png --virtual-time-budget=8000 \
             "file:///…/pruebas/captura.html?vista=hash&paso=fin"
  -->
  <div id="app"></div>

  <script src="../js/dominio/limites.js"></script>
  <script src="../js/dominio/clave.js"></script>
  <script src="../js/dominio/estructura.js"></script>
  <script src="../js/algoritmos/traza.js"></script>
  <script src="../js/algoritmos/secuencial.js"></script>
  <script src="../js/algoritmos/binaria.js"></script>
  <script src="../js/algoritmos/eliminacion.js"></script>
  <script src="../js/algoritmos/colisiones/reasignacion.js"></script>
  <script src="../js/algoritmos/hash/comun.js"></script>
  <script src="../js/algoritmos/hash/modulo.js"></script>
  <script src="../js/algoritmos/hash/cuadrado.js"></script>
  <script src="../js/algoritmos/hash/truncamiento.js"></script>
  <script src="../js/algoritmos/hash/plegamiento.js"></script>
  <script src="../js/algoritmos/hash/bases.js"></script>
  <script src="../js/algoritmos/hash/operaciones.js"></script>
  <script src="../js/persistencia/recientes.js"></script>
  <script src="../js/vista/componentes/casilla.js"></script>
  <script src="../js/vista/componentes/panel.js"></script>
  <script src="../js/vista/componentes/bitacora.js"></script>
  <script src="../js/vista/componentes/calculo.js"></script>
  <script src="../js/vista/elision.js"></script>
  <script src="../js/vista/reproductor.js"></script>
  <script src="../js/vista/animacion.js"></script>
  <script src="../js/vista/pantallas/menu.js"></script>
  <script src="../js/vista/pantallas/tema-busqueda.js"></script>
  <script src="../js/app.js"></script>

  <script>
    function enviar(formulario, valores) {
      for (const [nombre, valor] of Object.entries(valores)) {
        const campo = formulario.querySelector(`[name="${nombre}"]`);
        if (campo) campo.value = valor;
      }
      formulario.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    }

    // Insertar, buscar y eliminar comparten un panel: se escribe la clave una
    // vez y el botón dice qué hacer con ella.
    function operar(formularios, accion, valor) {
      const panel = formularios[1];
      panel.querySelector('[name="clave"]').value = valor;
      panel.querySelector(`[data-accion="${accion}"]`).click();
    }

    function entrarATema(nombreTema) {
      [...document.querySelectorAll('.tema-item')]
        .find((el) => el.textContent.includes(nombreTema))
        .click();
      return [...document.querySelectorAll('form.panel')];
    }

    const parametros = new URLSearchParams(location.search);
    // El reproductor vive en su propio panel: la operación puede ser buscar o
    // insertar, y ninguna de las dos es dueña del control.
    const avanzar = (veces) => {
      const boton = document.querySelector('[data-accion="siguiente"]');
      for (let i = 0; i < veces; i++) boton.click();
    };
    // ?paso= acepta `fin` (recorre la traza entera), un número de pasos —para
    // detenerse en uno concreto, como el que marca la casilla que se elimina—
    // o nada, que se queda en el primero.
    const pasosAAvanzar = (alFinal = 20) => {
      const paso = parametros.get('paso');
      if (paso === 'fin') return alFinal;
      const contados = Number(paso);
      return Number.isFinite(contados) && contados > 0 ? contados : 1;
    };

    function prepararBusqueda(nombreTema) {
      const formularios = entrarATema(nombreTema);
      enviar(formularios[0], { nombre: 'Práctica de clase', n: 24, l: 2 });
      for (const clave of [10, 18, 24, 31, 37, 42, 50, 63, 71, 84, 90, 97]) {
        operar(formularios, 'insertar', clave);
      }
      operar(formularios, 'buscar', 84);
      avanzar(pasosAAvanzar());
    }

    // La captura interesante de la transformación de claves es la inserción:
    // es donde se ve el cálculo revelándose junto a la casilla que resulta.
    // El tema se elige con ?tema=, para poder fotografiar el desarrollo de
    // cualquiera de las cinco funciones sin escribir una vista por cada una.
    function prepararHash({ colisiona }) {
      const formularios = entrarATema(parametros.get('tema') || 'Función módulo');
      // n, l y la clave final se pueden fijar por URL para fotografiar un
      // ejercicio concreto del docente sin tocar esta página. Sin ellos, la
      // estructura de 12 casillas de siempre.
      enviar(formularios[0], {
        nombre: 'Práctica de clase',
        n: Number(parametros.get('n')) || 12,
        l: Number(parametros.get('l')) || 4,
        posiciones: parametros.get('posiciones') || '',
        base: parametros.get('base') || '',
        operacion: parametros.get('operacion') || 'sumar',
        tratamiento: parametros.get('tratamiento') || 'reasignacion'
      });
      // 1004, 1016 y 1028 caen todas en la dirección 9: preparan el terreno
      // para que la última inserción tenga algo con qué chocar.
      for (const clave of [1004, 1010, 1023, 1035, 1016]) {
        operar(formularios, 'insertar', clave);
        avanzar(12);
      }
      operar(formularios, 'insertar', Number(parametros.get('clave')) || (colisiona ? 1028 : 1001));
      avanzar(pasosAAvanzar());
    }

    // Eliminación (CLAUDE.md 5.6). En las ordenadas la clave se localiza con
    // el algoritmo del tema y las siguientes cierran el hueco; con ?paso=fin
    // se llega al desplazamiento, y sin él al paso que marca la casilla.
    function prepararEliminacion(nombreTema) {
      const formularios = entrarATema(nombreTema);
      enviar(formularios[0], { nombre: 'Práctica de clase', n: 24, l: 2 });
      for (const clave of [10, 18, 24, 31, 37, 42, 50, 63, 71, 84, 90, 97]) {
        operar(formularios, 'insertar', clave);
      }
      operar(formularios, 'eliminar', Number(parametros.get('clave')) || 84);
      avanzar(pasosAAvanzar());
    }

    // La eliminación que hay que ver en una tabla hash es la que obliga a
    // redispersar: se borra la clave del medio de un sondeo y las de atrás
    // vuelven a pasar por la función.
    function prepararEliminacionHash() {
      const formularios = entrarATema(parametros.get('tema') || 'Función módulo');
      enviar(formularios[0], {
        nombre: 'Práctica de clase',
        n: Number(parametros.get('n')) || 12,
        l: Number(parametros.get('l')) || 4,
        posiciones: parametros.get('posiciones') || '',
        base: parametros.get('base') || '',
        operacion: parametros.get('operacion') || 'sumar',
        tratamiento: parametros.get('tratamiento') || 'reasignacion'
      });
      // 1004, 1016 y 1028 comparten dirección: las tres forman el grupo que
      // la eliminación tiene que volver a dispersar.
      for (const clave of [1004, 1010, 1023, 1035, 1016, 1028]) {
        operar(formularios, 'insertar', clave);
        avanzar(12);
      }
      // La redispersión es larga: cada clave del grupo trae su cálculo entero.
      operar(formularios, 'eliminar', Number(parametros.get('clave')) || 1016);
      avanzar(pasosAAvanzar(40));
    }

    document.addEventListener('DOMContentLoaded', () => {
      const vista = parametros.get('vista') || 'menu';
      if (vista === 'menu') return;
      if (vista === 'hash') return prepararHash({ colisiona: true });
      if (vista === 'hash-libre') return prepararHash({ colisiona: false });
      if (vista === 'eliminar-hash') return prepararEliminacionHash();
      if (vista === 'eliminar-binaria') return prepararEliminacion('Búsqueda binaria');
      if (vista === 'eliminar-secuencial') return prepararEliminacion('Búsqueda secuencial');
      prepararBusqueda(vista === 'binaria' ? 'Búsqueda binaria' : 'Búsqueda secuencial');
    });
  </script>
</body>
</html>
