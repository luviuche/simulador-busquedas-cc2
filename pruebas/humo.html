<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Prueba de humo — simulador CC2</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/pantallas.css">
</head>
<body>
  <!--
    Prueba de integración de la pantalla de tema: entra desde el menú, crea
    una estructura, inserta claves y recorre la traza, todo por el DOM real.
    `node --test` sólo cubre dominio y algoritmos; esto cubre la vista sin
    añadir una sola dependencia al proyecto.

    Abrir con doble clic y leer el informe, o sin ventana:
      msedge --headless --disable-gpu --virtual-time-budget=8000 \
             --dump-dom "file:///…/pruebas/humo.html"
  -->
  <div id="app"></div>
  <pre id="salida" style="font: 12px/1.6 monospace; padding: 16px;"></pre>

  <script src="../js/dominio/limites.js"></script>
  <script src="../js/dominio/clave.js"></script>
  <script src="../js/dominio/estructura.js"></script>
  <script src="../js/algoritmos/traza.js"></script>
  <script src="../js/algoritmos/secuencial.js"></script>
  <script src="../js/algoritmos/binaria.js"></script>
  <script src="../js/persistencia/recientes.js"></script>
  <script src="../js/vista/componentes/casilla.js"></script>
  <script src="../js/vista/componentes/panel.js"></script>
  <script src="../js/vista/componentes/bitacora.js"></script>
  <script src="../js/vista/elision.js"></script>
  <script src="../js/vista/reproductor.js"></script>
  <script src="../js/vista/animacion.js"></script>
  <script src="../js/vista/pantallas/menu.js"></script>
  <script src="../js/vista/pantallas/tema-busqueda.js"></script>
  <script src="../js/app.js"></script>

  <script>
    const registro = [];
    let fallas = 0;

    window.addEventListener('error', (evento) => {
      fallas++;
      registro.push('ERROR: ' + evento.message);
    });

    function afirmar(condicion, descripcion) {
      if (!condicion) fallas++;
      registro.push((condicion ? '✔ ' : '✕ ') + descripcion);
    }

    function enviar(formulario, valores) {
      for (const [nombre, valor] of Object.entries(valores)) {
        formulario.querySelector(`[name="${nombre}"]`).value = valor;
      }
      formulario.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    }

    // Resume el paso actual como "índice:estados" por columna dibujada.
    function retratarEstructura() {
      return [...document.querySelectorAll('.columna-casilla')].map((columna) => {
        const casilla = columna.querySelector('.casilla');
        const marca = columna.querySelector('.escala__marca').textContent;
        if (!casilla) return `[${marca}]`;
        return marca + ':' + casilla.className.replace(/casilla(--)?/g, '').trim().replace(/\s+/g, '+');
      }).join(' ');
    }

    function ejercitarTema(nombreTema, { n, l, claves, objetivo, comparacionesEsperadas }) {
      registro.push('', `── ${nombreTema} ──`);

      const item = [...document.querySelectorAll('.tema-item')]
        .find((el) => el.textContent.includes(nombreTema));
      item.click();
      afirmar(!!document.querySelector('.pantalla-tema'), 'la pantalla del tema se monta');

      afirmar(
        !document.querySelector('.pantalla-tema__encabezado').textContent.includes('Módulo'),
        'el encabezado no rotula el tema como módulo'
      );

      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { nombre: 'Prueba de humo', n, l });
      for (const clave of claves) enviar(formularios[1], { clave });

      const dibujadas = [...document.querySelectorAll('.casilla')].length;
      afirmar(dibujadas <= n, `la elisión acota lo dibujado (${dibujadas} de ${n} casillas)`);

      // La estructura es el foco de la clase: tiene que verse sin scroll, o al
      // proyectar se pierde justo lo que la aplicación existe para mostrar.
      // Se mide la pantalla contra el viewport y no el documento entero, porque
      // este informe vive en la misma página y falsearía la altura.
      const pantalla = document.querySelector('.pantalla-tema');
      afirmar(
        pantalla.getBoundingClientRect().height <= window.innerHeight + 1,
        `la pantalla se ancla al viewport (mide ${Math.round(pantalla.getBoundingClientRect().height)} de ${window.innerHeight})`
      );

      const lateral = document.querySelector('.pantalla-tema__panel-lateral');
      afirmar(
        getComputedStyle(lateral).overflowY === 'auto',
        'el desplazamiento vive en el panel lateral, no en la página'
      );

      const caja = document.querySelector('.estructura-horizontal').getBoundingClientRect();
      afirmar(
        caja.top >= 0 && caja.bottom <= window.innerHeight,
        `la estructura entra completa en el viewport (${Math.round(caja.top)}–${Math.round(caja.bottom)} de ${window.innerHeight})`
      );

      enviar(formularios[2], { objetivo });
      const siguiente = formularios[2].querySelector('[data-accion="siguiente"]');

      let paso = 1;
      let anterior = null;
      let retrato = retratarEstructura();
      while (retrato !== anterior && paso <= 40) {
        registro.push(`  paso ${paso}: ${retrato}`);
        anterior = retrato;
        siguiente.click();
        retrato = retratarEstructura();
        paso++;
      }

      afirmar(retrato.includes('encontrada'), `localiza la clave ${objetivo}`);

      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(
        metricas[0] === String(comparacionesEsperadas),
        `usa ${comparacionesEsperadas} comparaciones (reporta ${metricas[0]})`
      );

      const filas = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      const ultimas = filas.slice(-2);
      afirmar(ultimas[0] !== ultimas[1], 'la bitácora no repite el último mensaje al agotar la traza');
      registro.push('  bitácora final: ' + filas[filas.length - 1]);

      document.querySelector('.pantalla-tema__volver').click();
    }

    document.addEventListener('DOMContentLoaded', () => {
      // El catálogo no numera los temas: ese es el pedido del docente.
      const numerados = [...document.querySelectorAll('.tema-item')]
        .filter((el) => /^\s*\d/.test(el.textContent));
      afirmar(numerados.length === 0, 'ningún tema del catálogo aparece numerado');

      ejercitarTema('Búsqueda secuencial', {
        n: 16, l: 2, claves: [10, 20, 30, 40, 50, 60, 70, 80],
        objetivo: 70, comparacionesEsperadas: 7
      });

      ejercitarTema('Búsqueda binaria', {
        n: 16, l: 2, claves: [10, 20, 30, 40, 50, 60, 70, 80],
        objetivo: 70, comparacionesEsperadas: 3
      });

      registro.unshift(fallas === 0 ? 'RESULTADO: sin fallas' : `RESULTADO: ${fallas} fallas`);
      document.getElementById('salida').textContent = registro.join('\n');
    });
  </script>
</body>
</html>
